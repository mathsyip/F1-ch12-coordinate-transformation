<!DOCTYPE html>
<html lang="zh-Hant">

    <title>座標定位大師 - 學習 XY 座標</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f3f4f6;
            touch-action: manipulation;
        }
        #gameCanvas {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            background-color: white;
            cursor: crosshair;
        }
        /* 防止雙擊放大 */
        button { user-select: none; }
    </style>
</head>
<body class="min-h-screen lg:h-screen flex flex-col items-center py-4 lg:py-6 px-4 overscroll-none">

    <!-- 標題與控制列 -->

        <div>

            <p class="text-gray-500 text-xs lg:text-sm mt-1">提升你的直角坐標系空間邏輯</p>
        </div>

                <span id="livesDisplay" class="block text-lg lg:text-xl font-bold text-red-800">❤️❤️❤️</span>
            </div>

            </div>
            <div class="bg-blue-50 px-3 lg:px-4 py-2 rounded-lg border border-blue-200 text-center">

                <span id="scoreDisplay" class="block text-lg lg:text-xl font-bold text-blue-800">0</span>
            </div>

                <div class="flex bg-gray-200 rounded-lg p-1" id="difficultySelector">
                    <button data-diff="easy" class="diff-btn px-3 lg:px-4 py-1 rounded-md text-xs lg:text-sm font-medium transition-colors bg-white shadow text-green-600">簡單</button>
                    <button data-diff="medium" class="diff-btn px-3 lg:px-4 py-1 rounded-md text-xs lg:text-sm font-medium transition-colors text-gray-600 hover:bg-gray-300">中等</button>

                </div>
            </div>

    </header>

    <!-- 遊戲主體區域 -->
    <main class="w-full max-w-6xl flex flex-col lg:flex-row gap-6 flex-1 min-h-0 overflow-y-auto lg:overflow-hidden pb-6 lg:pb-0">
        
        <!-- 左側面板：題目與回饋 -->
        <aside class="w-full lg:w-1/3 flex flex-col gap-4 shrink-0">

                <h2 class="text-lg lg:text-xl font-bold text-gray-800 border-b pb-2 mb-4">當前任務</h2>
                
                <div id="questionArea" class="flex-1 flex flex-col justify-center min-h-[120px]">
                    <p id="questionText" class="text-base lg:text-lg text-gray-700 leading-relaxed font-medium">
                        載入中...
                    </p>
                </div>

                <div id="feedbackArea" class="mt-4 p-4 rounded-lg hidden text-center font-bold text-base lg:text-lg transition-all duration-300">
                    <!-- 回饋訊息顯示在這裡 -->
                </div>

                <button id="nextBtn" class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow transition-colors hidden text-base lg:text-lg">
                    下一題 ➔
                </button>
                <button id="restartBtn" class="mt-4 w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg shadow transition-colors hidden text-base lg:text-lg">
                    🔄 重新開始遊戲
                </button>
                <button id="startMainBtn" class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow transition-colors text-base lg:text-lg">
                    ▶️ 開始遊戲
                </button>
            </div>
            
            <div class="bg-white p-4 rounded-xl shadow text-xs lg:text-sm text-gray-600 overflow-y-auto hidden md:block">

                <ul class="list-disc pl-5 space-y-1">
                    <li><strong>簡單：</strong>直接在地圖上點擊要求的座標，或判斷並點擊所在的象限。</li>
                    <li><strong>中等：</strong>單一變換（包含平移、反射或旋轉），找出新座標。</li>
                    <li><strong>挑戰：</strong>連續進行變換，每次找出座標並收集寶藏，最終連成一個圖案！</li>
                </ul>

        </section>

                    { type: 'translate', target: {x: 3, y: 0}, text: "向右平移 2 單位 且 向上平移 3 單位" },
                    { type: 'translate', target: {x: 2, y: 3}, text: "向左平移 1 單位 且 向上平移 3 單位" }
                ]
            },
            {
                name: "小鳥 (動物)",
                start: {x: -4, y: 0},
                steps: [
                    { type: 'translate', target: {x: -2, y: 2}, text: "向右平移 2 單位 且 向上平移 2 單位" },
                    { type: 'translate', target: {x: 2, y: 2}, text: "向右平移 4 單位" },
                    { type: 'rotate', target: {x: 2, y: -2}, text: "繞原點 (0,0) 順時針旋轉 90 度" },
                    { type: 'translate', target: {x: 6, y: -2}, text: "向右平移 4 單位" },
                    { type: 'translate', target: {x: 2, y: -5}, text: "向左平移 4 單位 且 向下平移 3 單位" },
                    { type: 'translate', target: {x: -1, y: -2}, text: "向左平移 3 單位 且 向上平移 3 單位" },
                    { type: 'translate', target: {x: -4, y: 0}, text: "向左平移 3 單位 且 向上平移 2 單位" }
                ]
            }
        ];

        let lives = 3;
        let timeLeft = 60;
        let timerId = null;

        // --- DOM 元素 ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const questionTextEl = document.getElementById('questionText');
        const feedbackAreaEl = document.getElementById('feedbackArea');
        const nextBtnEl = document.getElementById('nextBtn');
        const restartBtnEl = document.getElementById('restartBtn');
        const startMainBtnEl = document.getElementById('startMainBtn');
        const scoreDisplayEl = document.getElementById('scoreDisplay');
        const livesDisplayEl = document.getElementById('livesDisplay');
        const timeDisplayEl = document.getElementById('timeDisplay');
        const diffBtns = document.querySelectorAll('.diff-btn');

        // --- 座標轉換工具 ---
        function g2p(gx, gy) {
            const innerWidth = canvas.width - 2 * PADDING;
            const innerHeight = canvas.height - 2 * PADDING;
            const x = PADDING + ((gx - GRID_MIN) / GRID_SIZE) * innerWidth;
            const y = canvas.height - (PADDING + ((gy - GRID_MIN) / GRID_SIZE) * innerHeight);
            return { x, y };
        }

        function p2g(px, py) {
            const innerWidth = canvas.width - 2 * PADDING;
            const innerHeight = canvas.height - 2 * PADDING;
            let gx = Math.round(((px - PADDING) / innerWidth) * GRID_SIZE + GRID_MIN);
            let gy = Math.round((((canvas.height - py) - PADDING) / innerHeight) * GRID_SIZE + GRID_MIN);
            gx = Math.max(GRID_MIN, Math.min(GRID_MAX, gx));
            gy = Math.max(GRID_MIN, Math.min(GRID_MAX, gy));
            return { x: gx, y: gy };
        }

        function getMousePos(evt) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX = evt.clientX;
            let clientY = evt.clientY;
            if(evt.touches && evt.touches.length > 0) {
                clientX = evt.touches[0].clientX;
                clientY = evt.touches[0].clientY;
            }
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        // --- 繪圖函數 ---
        function drawGrid() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (highlightAxis === 'x') {
                let pStart = g2p(GRID_MIN, 0);
                let pEnd = g2p(GRID_MAX, 0);
                ctx.beginPath();
                ctx.moveTo(pStart.x, pStart.y);
                ctx.lineTo(pEnd.x, pEnd.y);
                ctx.strokeStyle = 'rgba(253, 224, 71, 0.6)'; 
                ctx.lineWidth = 20; 
                ctx.stroke();
            } else if (highlightAxis === 'y') {
                let pStart = g2p(0, GRID_MIN);
                let pEnd = g2p(0, GRID_MAX);
                ctx.beginPath();
                ctx.moveTo(pStart.x, pStart.y);
                ctx.lineTo(pEnd.x, pEnd.y);
                ctx.strokeStyle = 'rgba(253, 224, 71, 0.6)'; 
                ctx.lineWidth = 20;
                ctx.stroke();
            }

            ctx.lineWidth = 1.5;
            for (let i = GRID_MIN; i <= GRID_MAX; i++) {
                let pStart = g2p(i, GRID_MIN);
                let pEnd = g2p(i, GRID_MAX);
                ctx.beginPath(); ctx.moveTo(pStart.x, pStart.y); ctx.lineTo(pEnd.x, pEnd.y);
                ctx.strokeStyle = (i === 0) ? '#000000' : '#e5e7eb'; 
                ctx.lineWidth = (i === 0) ? 4 : 1.5;
                ctx.stroke();

                pStart = g2p(GRID_MIN, i); pEnd = g2p(GRID_MAX, i);
                ctx.beginPath(); ctx.moveTo(pStart.x, pStart.y); ctx.lineTo(pEnd.x, pEnd.y);
                ctx.strokeStyle = (i === 0) ? '#000000' : '#e5e7eb';
                ctx.lineWidth = (i === 0) ? 4 : 1.5;
                ctx.stroke();
            }

            ctx.font = 'bold 20px "Noto Sans TC", sans-serif';
            ctx.fillStyle = '#4b5563'; 
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            for (let i = GRID_MIN; i <= GRID_MAX; i++) {
                if (i === 0) continue; 
                let px = g2p(i, 0); ctx.fillText(i.toString(), px.x, px.y + 24);
                let py = g2p(0, i); ctx.fillText(i.toString(), py.x - 26, py.y);
            }
            let origin = g2p(0,0);
            ctx.fillText('0', origin.x - 20, origin.y + 20);
            ctx.font = 'bold 26px sans-serif';
            ctx.fillStyle = 'black';
            ctx.fillText('X', g2p(GRID_MAX, 0).x + 28, g2p(GRID_MAX, 0).y);
            ctx.fillText('Y', g2p(0, GRID_MAX).x, g2p(0, GRID_MAX).y - 28);
        }

        function drawPoint(x, y, color, size = 10, label = null) {
            const p = g2p(x, y);
            ctx.beginPath();
            ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            if (label) {
                ctx.font = 'bold 20px "Noto Sans TC"';
                ctx.fillStyle = color;
                ctx.textAlign = 'left';
                ctx.textBaseline = 'bottom';
                ctx.fillText(label, p.x + 14, p.y - 14);
            }
        }
        
        function drawEmoji(x, y, emoji, size = 48) {
            const p = g2p(x, y);
            ctx.font = `${size}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(emoji, p.x, p.y);
        }

        // 取得象限名稱中英文字
        function getQuadrantInfo(x, y) {
            if (x > 0 && y > 0) return { zh: '第一象限', en: 'Quadrant I' };
            if (x < 0 && y > 0) return { zh: '第二象限', en: 'Quadrant II' };
            if (x < 0 && y < 0) return { zh: '第三象限', en: 'Quadrant III' };
            if (x > 0 && y < 0) return { zh: '第四象限', en: 'Quadrant IV' };
            return { zh: '', en: '' };
        }

        function render() {
            drawGrid();

            // --- 象限題的正確象限區域高亮 ---
            if (currentQuestionType === 'quadrant' && (state === 'answered' || state === 'gameover')) {
                let xStart = targetCoord.x > 0 ? 0 : GRID_MIN;
                let xEnd = targetCoord.x > 0 ? GRID_MAX : 0;
                let yStart = targetCoord.y > 0 ? 0 : GRID_MIN;
                let yEnd = targetCoord.y > 0 ? GRID_MAX : 0;

                let pTopLeft = g2p(xStart, yEnd);
                let pBottomRight = g2p(xEnd, yStart);

                ctx.fillStyle = 'rgba(16, 185, 129, 0.2)'; // 淺綠色背景標示正確象限
                ctx.fillRect(pTopLeft.x, pTopLeft.y, pBottomRight.x - pTopLeft.x, pBottomRight.y - pTopLeft.y);
                
                // 畫出實際位置幫助玩家理解
                drawPoint(targetCoord.x, targetCoord.y, '#10b981', 10, `實際位置`);

                // 標明象限中英文字浮水印
                const quadInfo = getQuadrantInfo(targetCoord.x, targetCoord.y);
                const textX = (pTopLeft.x + pBottomRight.x) / 2;
                const textY = (pTopLeft.y + pBottomRight.y) / 2;
                
                ctx.font = 'bold 48px "Noto Sans TC", sans-serif';
                ctx.fillStyle = 'rgba(6, 95, 70, 0.45)'; // 半透明深綠色
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(quadInfo.zh, textX, textY - 24);
                
                ctx.font = 'bold 28px sans-serif';
                ctx.fillText(quadInfo.en, textX, textY + 28);
            }

            // --- 挑戰模式：畫出已收集圖案的連線與所有寶藏 ---
            if (currentDifficulty === 'challenge' && collectedTreasures.length > 0) {
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(59, 130, 246, 0.6)'; // 藍色連線
                ctx.lineWidth = 6;
                let startP = g2p(collectedTreasures[0].x, collectedTreasures[0].y);
                ctx.moveTo(startP.x, startP.y);
                for (let i = 1; i < collectedTreasures.length; i++) {
                    let p = g2p(collectedTreasures[i].x, collectedTreasures[i].y);
                    ctx.lineTo(p.x, p.y);
                }
                // 若挑戰完成，將圖案閉合 (最後一點連回第一點)
                if (state === 'gameover' && challengeStep === currentChallenge.steps.length - 1 && score > 0) {
                     ctx.lineTo(startP.x, startP.y);
                }
                ctx.stroke();

                // 畫出所有累積的寶藏
                collectedTreasures.forEach((ct) => {
                    drawEmoji(ct.x, ct.y, '💎', 50);
                });
            }

            // --- 旋轉題目的起點藍色虛線長方形 ---
            if (isRotationQuestion && startCoord) {
                let pOrigin = g2p(0, 0);
                let pStart = g2p(startCoord.x, startCoord.y);
                ctx.beginPath();
                ctx.setLineDash([8, 8]);
                ctx.strokeStyle = 'rgba(59, 130, 246, 0.7)'; 
                ctx.lineWidth = 6; 
                ctx.strokeRect(pOrigin.x, pOrigin.y, pStart.x - pOrigin.x, pStart.y - pOrigin.y);
                ctx.setLineDash([]); 
            }

            // --- 旋轉題目的終點紅色虛線長方形 ---
            if (isRotationQuestion && (state === 'answered' || state === 'gameover')) {
                let pOrigin = g2p(0, 0);
                let pTarget = g2p(targetCoord.x, targetCoord.y);
                ctx.beginPath();
                ctx.setLineDash([8, 8]);
                ctx.strokeStyle = 'rgba(239, 68, 68, 0.7)'; 
                ctx.lineWidth = 6; 
                ctx.strokeRect(pOrigin.x, pOrigin.y, pTarget.x - pOrigin.x, pTarget.y - pOrigin.y);
                ctx.setLineDash([]); 
            }

            // 遊戲進行中：顯示滑鼠懸停預覽
            if (state === 'playing' && hoverCoord) {
                drawPoint(hoverCoord.x, hoverCoord.y, 'rgba(59, 130, 246, 0.5)', 12); 
                const p = g2p(hoverCoord.x, hoverCoord.y);
                const pXAxis = g2p(hoverCoord.x, 0);
                const pYAxis = g2p(0, hoverCoord.y);
                ctx.beginPath(); ctx.setLineDash([8, 8]);
                ctx.moveTo(p.x, p.y); ctx.lineTo(pXAxis.x, pXAxis.y);
                ctx.moveTo(p.x, p.y); ctx.lineTo(pYAxis.x, pYAxis.y);
                ctx.strokeStyle = 'rgba(59, 130, 246, 0.4)'; ctx.lineWidth = 2; ctx.stroke();
                ctx.setLineDash([]);
            }

            // 顯示起點
            if (startCoord) {
                if (currentDifficulty === 'medium') {
                    drawPoint(startCoord.x, startCoord.y, '#f59e0b', 10, '起點');
                } else if (currentDifficulty === 'challenge' && state !== 'gameover') {
                    // 挑戰模式標示當前所在的寶藏點
                    drawPoint(startCoord.x, startCoord.y, '#f59e0b', 10, '當前位置');
                }
            }

            missedCoords.forEach(mc => drawEmoji(mc.x, mc.y, '🪨', 46));

            if (state === 'answered' && currentDifficulty !== 'challenge') {
                if (currentQuestionType === 'quadrant') {
                    // 象限題：將寶藏放在玩家點擊的正確象限位置
                    drawEmoji(clickedCoord.x, clickedCoord.y, '💎', 50);
                } else {
                    // 精確題：將寶藏放在目標座標上
                    drawEmoji(targetCoord.x, targetCoord.y, '💎', 50);
                }
            }

            if (state === 'gameover') {
                if (clickedCoord && (clickedCoord.x !== targetCoord.x || clickedCoord.y !== targetCoord.y)) {
                    drawPoint(targetCoord.x, targetCoord.y, '#10b981', 12, '正確位置'); 
                    const pClick = g2p(clickedCoord.x, clickedCoord.y);
                    const pTarget = g2p(targetCoord.x, targetCoord.y);
                    ctx.beginPath(); ctx.setLineDash([6, 6]);
                    ctx.moveTo(pClick.x, pClick.y); ctx.lineTo(pTarget.x, pTarget.y);
                    ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 3; ctx.stroke();
                    ctx.setLineDash([]);
                }
            }
        }

        // --- 遊戲邏輯 ---
        function rand(min, max) {
            return Math.floor(Math.random() * (max - min + 1) + min);
        }
        
        function updateLivesDisplay() {
            let hearts = '';
            for(let i=0; i<lives; i++) hearts += '❤️';
            for(let i=lives; i<3; i++) hearts += '🖤';
            livesDisplayEl.innerText = hearts || '💀';
        }

        function updateTimeDisplay() {
            timeDisplayEl.innerText = timeLeft + 's';
            if(timeLeft <= 10) {
                timeDisplayEl.classList.add('text-red-600', 'animate-pulse');
            } else {
                timeDisplayEl.classList.remove('text-red-600', 'animate-pulse');
            }
        }
        
        function startNewGame() {
            state = 'playing';
            score = 0;
            lives = 3;
            timeLeft = 60; // 統一60秒，挑戰模式答對會加時
            scoreDisplayEl.innerText = score;
            updateLivesDisplay();
            updateTimeDisplay();
            
            document.getElementById('difficultySelector').classList.add('opacity-50', 'pointer-events-none');
            restartBtnEl.classList.add('hidden');
            startMainBtnEl.classList.add('hidden');
            
            // 初始化挑戰模式
            collectedTreasures = [];
            if (currentDifficulty === 'challenge') {
                currentChallenge = challengePatterns[rand(0, challengePatterns.length - 1)];
                challengeStep = 0;
                // 自動收集圖案的起始點
                collectedTreasures.push({x: currentChallenge.start.x, y: currentChallenge.start.y});
            }

            clearInterval(timerId);
            timerId = setInterval(() => {
                if(state !== 'playing') return;
                timeLeft--;
                updateTimeDisplay();
                if (timeLeft <= 0) {
                    endGame('時間到！');
                }
            }, 1000);
            
            generateQuestion();
        }
        
        function endGame(reason) {
            state = 'gameover';
            clearInterval(timerId);
            document.getElementById('difficultySelector').classList.remove('opacity-50', 'pointer-events-none');
            
            questionTextEl.innerHTML = `<span class="text-red-600 font-bold text-3xl block mb-4">遊戲結束</span>
                                        <span class="text-xl text-gray-700">${reason}</span><br>
                                        <span class="text-2xl font-bold mt-2 block">最終得分：${score}</span>`;
            feedbackAreaEl.classList.add('hidden');
            nextBtnEl.classList.add('hidden');
            restartBtnEl.classList.remove('hidden');
            render();
        }

        function generateQuestion() {
            if (state === 'gameover') return;
            let qText = "";
            let valid = false;

            while (!valid) {
                highlightAxis = null;
                isRotationQuestion = false;
                currentQuestionType = 'exact'; // 預設為尋找精確點

                if (currentDifficulty === 'easy') {
                    // 50% 機率是尋找座標，50% 機率是象限判斷
                    if (Math.random() < 0.5) {
                        targetCoord.x = rand(-9, 9);
                        targetCoord.y = rand(-9, 9);
                        startCoord = null;
                        qText = `<span class="text-blue-600 font-bold text-2xl block mb-2">請點擊座標點：</span>
                                 <span class="text-4xl font-black">(${targetCoord.x}, ${targetCoord.y})</span>`;
                    } else {
                        currentQuestionType = 'quadrant';
                        let tx, ty;
                        // 象限題排除落在 X、Y 軸上的點 (0)
                        do { tx = rand(-9, 9); } while (tx === 0);
                        do { ty = rand(-9, 9); } while (ty === 0);
                        targetCoord = { x: tx, y: ty };
                        startCoord = null;
                        
                        qText = `<span class="text-purple-600 font-bold text-2xl block mb-2">象限判斷：</span>
                                 請問座標 <span class="text-4xl font-black">(${tx}, ${ty})</span> 位於第幾象限？<br><br>
                                 <span class="text-blue-600 font-bold">請點擊畫布上該象限的「任意位置」。</span>`;
                    }
                    valid = true;
                } 
                else if (currentDifficulty === 'medium') {
                    let sx = rand(-8, 8);
                    let sy = rand(-8, 8);
                    startCoord = { x: sx, y: sy };

                    const modes = ['translate', 'reflect', 'rotate'];
                    const chosenMode = modes[rand(0, 2)];

                    if (chosenMode === 'translate') {
                        let dx = 0, dy = 0;
                        if (Math.random() < 0.5) { do { dx = rand(-5, 5); } while (dx === 0); } 
                        else { do { dy = rand(-5, 5); } while (dy === 0); }
                        
                        let tx = sx + dx; let ty = sy + dy;

                        if (tx >= -10 && tx <= 10 && ty >= -10 && ty <= 10) {
                            targetCoord = { x: tx, y: ty };
                            let moveStr = "";
                            if (dx > 0) moveStr = `向右平移 <span class="font-bold text-blue-600">${dx}</span> 單位`;
                            if (dx < 0) moveStr = `向左平移 <span class="font-bold text-blue-600">${-dx}</span> 單位`;
                            if (dy > 0) moveStr = `向上平移 <span class="font-bold text-blue-600">${dy}</span> 單位`;
                            if (dy < 0) moveStr = `向下平移 <span class="font-bold text-blue-600">${-dy}</span> 單位`;

                            qText = `從起點 <b>(${sx}, ${sy})</b> 開始：<br><br>
                                     請執行操作：${moveStr}。<br><br>
                                     <span class="text-blue-600 font-bold">請點擊最終的座標位置。</span>`;
                            valid = true;
                        }
                    } 
                    else if (chosenMode === 'reflect') {
                        const reflectType = Math.random() < 0.5 ? 'x' : 'y';
                        highlightAxis = reflectType; 
                        if (reflectType === 'x') {
                            if (sy === 0) sy = rand(1, 8) * (Math.random() < 0.5 ? 1 : -1);
                            startCoord = { x: sx, y: sy }; targetCoord = { x: sx, y: -sy };
                            qText = `已知起點為 <b>(${sx}, ${sy})</b>：<br><br>
                                     請將該點<span class="font-bold text-orange-600">以 X 軸為對稱軸進行反射</span>。<br><br>
                                     <span class="text-blue-600 font-bold">請點擊變換後的座標位置。</span>`;
                        } else {
                            if (sx === 0) sx = rand(1, 8) * (Math.random() < 0.5 ? 1 : -1);
                            startCoord = { x: sx, y: sy }; targetCoord = { x: -sx, y: sy };
                            qText = `已知起點為 <b>(${sx}, ${sy})</b>：<br><br>
                                     請將該點<span class="font-bold text-orange-600">以 Y 軸為對稱軸進行反射</span>。<br><br>
                                     <span class="text-blue-600 font-bold">請點擊變換後的座標位置。</span>`;
                        }
                        valid = true;
                    } 
                    else if (chosenMode === 'rotate') {
                        if (sx === 0 && sy === 0) { sx = 3; sy = -4; startCoord = { x: sx, y: sy }; }
                        isRotationQuestion = true; 
                        const rotations = [
                            { name: "繞原點 (0,0) 順時針旋轉 90 度", op: (x,y) => ({x: y, y: -x}) },
                            { name: "繞原點 (0,0) 逆時針旋轉 90 度", op: (x,y) => ({x: -y, y: x}) },
                            { name: "繞原點 (0,0) 順時針旋轉 180 度", op: (x,y) => ({x: -x, y: -y}) }
                        ];
                        let rot = rotations[rand(0, rotations.length - 1)];
                        targetCoord = rot.op(sx, sy);
                        qText = `已知起點為 <b>(${sx}, ${sy})</b>：<br><br>
                                 請將該點<span class="font-bold text-purple-600">${rot.name}</span>。<br><br>
                                 <span class="text-blue-600 font-bold">請點擊旋轉後的座標位置。</span>`;
                        valid = true;
                    }
                } 
                else if (currentDifficulty === 'challenge') {
                    // 挑戰模式：根據目前的題庫進度發放題目
                    let step = currentChallenge.steps[challengeStep];
                    
                    // 從上一個收集到的寶藏點出發
                    startCoord = collectedTreasures[collectedTreasures.length - 1]; 
                    targetCoord = step.target;

                    isRotationQuestion = (step.type === 'rotate');
                    highlightAxis = step.axis || null;

                    qText = `<div class="mb-3 inline-block bg-purple-100 text-purple-800 px-4 py-1 rounded-full text-sm font-bold border border-purple-300 shadow-sm">
                                任務進度：${challengeStep + 1} / ${currentChallenge.steps.length}
                             </div><br>
                             從目前位置 <b>(${startCoord.x}, ${startCoord.y})</b> 繼續：<br><br>
                             請將該點<span class="font-bold text-purple-600">${step.text}</span>。<br><br>
                             <span class="text-blue-600 font-bold">請點擊變換後的新座標位置。</span>`;
                    valid = true;
                }
            }

            questionTextEl.innerHTML = qText;
            state = 'playing';
            clickedCoord = null;
            hoverCoord = null;
            missedCoords = [];
            
            feedbackAreaEl.classList.add('hidden');
            feedbackAreaEl.className = "mt-4 p-4 rounded-lg hidden text-center font-bold text-lg transition-all duration-300";
            nextBtnEl.classList.add('hidden');
            
            render();
        }

        function handleAnswer(gx, gy) {
            if (state !== 'playing') return;
            if (missedCoords.some(m => m.x === gx && m.y === gy)) return;

            let isCorrect = false;
            if (currentQuestionType === 'quadrant') {
                // 判斷象限是否一致，並且不能點在軸上 (gx=0 或 gy=0)
                isCorrect = (gx !== 0 && gy !== 0) &&
                            ((gx > 0) === (targetCoord.x > 0)) && 
                            ((gy > 0) === (targetCoord.y > 0));
            } else {
                isCorrect = (gx === targetCoord.x && gy === targetCoord.y);
            }

            feedbackAreaEl.classList.remove('hidden');
            
            if (isCorrect) {
                state = 'answered';
                clickedCoord = { x: gx, y: gy };
                const points = currentDifficulty === 'easy' ? 10 : (currentDifficulty === 'medium' ? 20 : 30);
                score += points;

                if (currentDifficulty === 'challenge') {
                    // 將新找到的目標加入歷史寶藏記錄中
                    collectedTreasures.push({x: gx, y: gy});
                    
                    if (challengeStep < currentChallenge.steps.length - 1) {
                        feedbackAreaEl.innerHTML = `🎉 找到寶藏了！ (+${points} 分)<br><span class="text-sm font-normal">進度 ${challengeStep + 1}/${currentChallenge.steps.length}，準備進行下一步！</span>`;
                        feedbackAreaEl.className = "mt-4 p-4 rounded-lg text-center font-bold text-lg transition-all duration-300 bg-green-100 text-green-800 border border-green-300";
                        nextBtnEl.classList.remove('hidden');
                        
                        // 獎勵額外思考時間
                        timeLeft += 10;
                        updateTimeDisplay();
                    } else {
                        // 挑戰模式全部完成！
                        score += 50; // 獲得額外分數
                        scoreDisplayEl.innerText = score;
                        feedbackAreaEl.innerHTML = `🌟 太棒了！你收集完所有寶藏，完成了「${currentChallenge.name}」圖案！<br><span class="text-sm font-normal">(獲得 +50 額外完成獎勵)</span>`;
                        feedbackAreaEl.className = "mt-4 p-4 rounded-lg text-center font-bold text-lg transition-all duration-300 bg-yellow-100 text-yellow-800 border border-yellow-400 shadow-md";
                        setTimeout(() => endGame('成功完成圖案！'), 3000); // 延遲讓玩家欣賞圖案
                    }
                } else {
                    if (currentQuestionType === 'quadrant') {
                        const quadInfo = getQuadrantInfo(targetCoord.x, targetCoord.y);
                        feedbackAreaEl.innerHTML = `🎉 答對了！這裡是${quadInfo.zh} (${quadInfo.en})！ (+${points} 分)`;
                    } else {
                        feedbackAreaEl.innerHTML = `🎉 找到寶藏了！ (+${points} 分)`;
                    }
                    feedbackAreaEl.className = "mt-4 p-4 rounded-lg text-center font-bold text-lg transition-all duration-300 bg-green-100 text-green-800 border border-green-300";
                    nextBtnEl.classList.remove('hidden');
                }
            } else {
                lives--;
                updateLivesDisplay();
                missedCoords.push({ x: gx, y: gy });
                
                let wrongHint = "";
                if (currentQuestionType === 'quadrant') {
                    const quadInfo = getQuadrantInfo(targetCoord.x, targetCoord.y);
                    if (gx === 0 || gy === 0) {
                        wrongHint = `座標軸不屬於任何象限喔！正確答案是${quadInfo.zh} (${quadInfo.en})。`;
                    } else {
                        wrongHint = `該點位於另一象限！正確答案是${quadInfo.zh} (${quadInfo.en})。`;
                    }
                } else {
                    wrongHint = `你點擊了 (${gx}, ${gy})，正確答案是 (${targetCoord.x}, ${targetCoord.y})`;
                }
                
                if (lives <= 0) {
                    state = 'gameover'; 
                    clickedCoord = { x: gx, y: gy }; 
                    feedbackAreaEl.innerHTML = `🪨 哎呀，挖到石頭了！<br><span class="text-sm font-normal">${wrongHint}</span>`;
                    feedbackAreaEl.className = "mt-4 p-4 rounded-lg text-center font-bold text-lg transition-all duration-300 bg-red-100 text-red-800 border border-red-300";
                    setTimeout(() => endGame('生命值耗盡！'), 1500); 
                } else {
                    let retryText = currentQuestionType === 'quadrant' ? `這不是正確的象限，請再試一次！` : `(${gx}, ${gy}) 不是正確位置，請再試一次！`;
                    feedbackAreaEl.innerHTML = `🪨 哎呀，挖到石頭了！<br><span class="text-sm font-normal">${retryText}</span>`;
                    feedbackAreaEl.className = "mt-4 p-4 rounded-lg text-center font-bold text-lg transition-all duration-300 bg-orange-100 text-orange-800 border border-orange-300";
                }
            }
            
            scoreDisplayEl.innerText = score;
            render();
        }

        // --- 事件監聽器 ---
        diffBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                if (state === 'playing' || state === 'answered') return;

                diffBtns.forEach(b => {
                    b.classList.remove('bg-white', 'shadow', 'text-green-600', 'text-orange-600', 'text-purple-600');
                    b.classList.add('text-gray-600', 'hover:bg-gray-300');
                });
                
                const target = e.target;
                target.classList.remove('text-gray-600', 'hover:bg-gray-300');
                target.classList.add('bg-white', 'shadow');
                
                currentDifficulty = target.dataset.diff;
                if(currentDifficulty === 'easy') target.classList.add('text-green-600');
                if(currentDifficulty === 'medium') target.classList.add('text-orange-600');
                if(currentDifficulty === 'challenge') target.classList.add('text-purple-600'); // 挑戰用紫色
            });
        });

        // 點擊下一題，在挑戰模式時推進進度
        nextBtnEl.addEventListener('click', () => {
            if (currentDifficulty === 'challenge' && state === 'answered') {
                challengeStep++;
            }
            generateQuestion();
        });
        
        restartBtnEl.addEventListener('click', startNewGame);
        startMainBtnEl.addEventListener('click', startNewGame);

        canvas.addEventListener('mousemove', (e) => {
            if (state !== 'playing') return;
            const pos = getMousePos(e);
            hoverCoord = p2g(pos.x, pos.y);
            render();
        });

        canvas.addEventListener('mouseleave', () => {
            hoverCoord = null;
            if (state === 'playing') render();
        });

        canvas.addEventListener('click', (e) => {
            if (state !== 'playing') return;
            const pos = getMousePos(e);
            const gridPos = p2g(pos.x, pos.y);
            handleAnswer(gridPos.x, gridPos.y);
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (state !== 'playing') return;
            const pos = getMousePos(e);
            const gridPos = p2g(pos.x, pos.y);
            handleAnswer(gridPos.x, gridPos.y);
        }, { passive: false });

        // 監聽視窗縮放以重繪畫面
        window.addEventListener('resize', () => {
            render();
        });

        function initApp() {
            state = 'init';
            questionTextEl.innerHTML = `<span class="text-blue-600 font-bold text-2xl block mb-4">歡迎來到座標定位大師！</span>
                                        <span class="text-lg text-gray-700 font-medium">請在上方選擇難度，然後按下「開始遊戲」。</span>`;
            render();
        }
        
        initApp();

    </script>
</body>
</html>
